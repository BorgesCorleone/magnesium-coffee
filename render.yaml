# Blueprint da Render: cria a API e o front a partir deste repositório.
# Nenhum segredo aqui: os valores com "sync: false" são pedidos no painel da Render.
services:
  - type: web
    name: magnesium-coffee-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass # publica a cada push no main, depois que o CI passar
    buildFilter:
      ignoredPaths: ["front/**", "docs/**", "**/*.md", "*.http"]
    envVars:
      - key: ConnectionStrings__Padrao
        sync: false
      - key: Seed__AdminSenha
        sync: false
      - key: Jwt__Segredo
        generateValue: true
      - key: Cors__Origens
        value: https://magnesium-coffee-web.onrender.com,http://localhost:5173
      # a Render termina o HTTPS e repassa como HTTP; isso faz a API ler o X-Forwarded-Proto
      # (o Location do 201 sai com https://)
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"

  - type: web
    name: magnesium-coffee-web
    runtime: static
    branch: main
    rootDir: front
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths: ["front/**"]
    envVars:
      - key: VITE_API_URL
        value: https://magnesium-coffee-api.onrender.com
      - key: NODE_VERSION
        value: "22"
    routes:
      # SPA: qualquer rota (/cafes/3, /pedidos...) serve o index.html e o React Router resolve
      - type: rewrite
        source: /*
        destination: /index.html
