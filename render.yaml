# Blueprint da Render: cria o Web Service da API a partir deste repositório.
# Nenhum segredo aqui: os valores com "sync: false" são pedidos no painel da Render.
services:
  - type: web
    name: magnesium-coffee-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass # publica a cada push no main, depois que o CI passar
    envVars:
      - key: ConnectionStrings__Padrao
        sync: false
      - key: Seed__AdminSenha
        sync: false
      - key: Jwt__Segredo
        generateValue: true
